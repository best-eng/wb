<html>
<head>
    <meta charset="utf-8">
    <title>Заголовок документа</title>
</head>
<body>
    Содержание документа

    <!-- п.2: заголовок первого уровня -->
    <h1>Заголовок первого уровня</h1>

    <!-- п.3: заголовок второго уровня -->
    <h2>Заголовок второго уровня</h2>

    <!-- п.4: отдельный абзац. Пробелы и переводы строки внутри абзаца
         браузер сворачивает в один пробел, поэтому текст можно набирать
         в несколько строк произвольно -->
    <p>Отдельный
       абзац</p>

    <!-- п.5: горизонтальная линейка -->
    <hr>

    <!-- п.6: ещё один абзац -->
    <p>Ещё один абзац текста</p>

    <!-- п.11-12: фраза оформлена по образцу.
         "Нас" - зачёркнутый; в слове "утро" каждая буква своего цвета;
         "встречает" - подчёркнутый и зачёркнутый;
         в слове "прохладой": ПРО - красным, ОЙ - синим -->
    <p align="center">
        <font size="+2">
            <s>Нас</s>
            <i><font color="#FF8000">у</font><font color="#8000FF">т</font><font color="#008000">р</font><font color="#FF0000">о</font></i>
            <u><s><b>встречает</b></s></u>
            <font color="#FF0000">про</font><i>хлад</i><font color="#0000FF"><b>ой</b></font>
        </font>
    </p>

    <!-- п.13: строка об авторе - курсивом, размер задан относительным
         изменением (SIZE="+2") -->
    <p><font size="+2"><i>Выполнил(а) студент группы NNN Фамилия Имя</i></font></p>
</body>
</html>

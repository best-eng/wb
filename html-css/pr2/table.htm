<html>
<head>
    <meta charset="utf-8">
    <title>Создание таблиц</title>
</head>
<body>

    <!-- п.2-7: таблица "Список телефонов" -->
    <table border="10" width="100%">
        <caption align="top">Список телефонов</caption>
        <tr bgcolor="YELLOW" align="CENTER">
            <th>Фамилия</th>
            <th>Номер телефона</th>
        </tr>
        <tr>
            <td>Петров</td>
            <td>292-15-13</td>
        </tr>
        <tr>
            <td>Демидов</td>
            <td>775-36-15</td>
        </tr>
        <tr>
            <td align="CENTER" colspan="2">На первом этаже здания имеется бесплатный телефон-автомат.</td>
        </tr>
    </table>

    <hr>

    <!-- п.13: таблички с объединением ячеек.
         Объединение задаётся параметрами colspan (по горизонтали)
         и rowspan (по вертикали) в тегах <TD> -->
    <p>Задание 13. Таблицы с объединением ячеек:</p>

    <table border="0" cellpadding="10">
        <tr valign="top">
            <td>
                <!-- Табличка 1: "1" на два ряда, "2" на две колонки -->
                <table border="2" width="220" height="150" align="center">
                    <tr align="center">
                        <td rowspan="2" width="70">1</td>
                        <td colspan="2">2</td>
                    </tr>
                    <tr align="center">
                        <td>3</td>
                        <td>4</td>
                    </tr>
                </table>
            </td>
            <td>
                <!-- Табличка 2: "1" и "4" на две колонки -->
                <table border="2" width="160" height="220" align="center">
                    <tr align="center">
                        <td colspan="2">1</td>
                    </tr>
                    <tr align="center">
                        <td>2</td>
                        <td>3</td>
                    </tr>
                    <tr align="center">
                        <td colspan="2">4</td>
                    </tr>
                </table>
            </td>
            <td>
                <!-- Табличка 3: "1" на две колонки, "2" на два ряда -->
                <table border="2" width="160" height="220" align="center">
                    <tr align="center">
                        <td colspan="2">1</td>
                    </tr>
                    <tr align="center">
                        <td rowspan="2" width="80">2</td>
                        <td>3</td>
                    </tr>
                    <tr align="center">
                        <td>4</td>
                    </tr>
                </table>
            </td>
            <td>
                <!-- Табличка 4: "3" на два ряда, "4" на две колонки -->
                <table border="2" width="160" height="220" align="center">
                    <tr align="center">
                        <td>1</td>
                        <td rowspan="2" width="80">3</td>
                    </tr>
                    <tr align="center">
                        <td>2</td>
                    </tr>
                    <tr align="center">
                        <td colspan="2">4</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>

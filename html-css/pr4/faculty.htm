<html>
<head>
    <meta charset="utf-8">
    <title>Проект "Форма - ФАКУЛЬТЕТЫ"</title>
</head>
<body bgcolor="#C0C0C0">

    <h2 align="center"><font face="Courier New" color="#000000">П р и м е р &nbsp; с о з д а н и я &nbsp; ф о р м ы</font></h2>

    <form name="faculties" action="" method="get">

        <!-- основная группа элементов на розовой подложке -->
        <table width="90%" align="center" bgcolor="#FFC0CB" cellpadding="14" border="1" bordercolor="#E8A0B0">
        <tr><td>

            <table width="100%" cellpadding="6">
                <tr valign="top">
                    <td width="50%">
                        <b>факультет:</b>
                        <!-- обычный выпадающий список -->
                        <select name="fakultet">
                            <option value="fmf" style="background:#FF0000; color:#FFFFFF">физ.мат.фак.</option>
                            <option value="sport" style="background:#FF66CC">спорт.фак.</option>
                            <option value="inyaz" style="background:#0033CC; color:#FFFFFF">фак.иностр.языков</option>
                        </select>
                    </td>
                    <td width="50%">
                        <b>кафедры ФМФ:</b>
                        <select name="kafedra">
                            <option value="metod">каф. метод. преподав.</option>
                            <option value="inform">каф. информ.</option>
                            <option value="matem">каф. математики</option>
                        </select>
                    </td>
                </tr>
                <tr valign="top">
                    <td>
                        <b>специальности ФМФ:</b><br>
                        <!-- список с прокруткой: size задаёт число видимых строк -->
                        <select name="spec" size="4" style="width:300px">
                            <option>1) преподаватель&nbsp; информатики;</option>
                            <option>2) преподаватель&nbsp; математики;</option>
                            <option>3) профессиональное&nbsp; обучение</option>
                            <option>4) преподаватель&nbsp; физики&nbsp; и&nbsp; информатики</option>
                        </select>
                    </td>
                    <td>
                        <b>группы кафедры информатики:</b><br>
                        <!-- multiple: можно выбрать несколько групп сразу -->
                        <select name="gruppy" size="4" multiple="multiple">
                            <option>И-17 (к.о)</option>
                            <option selected>И-18 (р.о)</option>
                            <option selected>И-27 (к.о)</option>
                            <option>И-28 (р.о)</option>
                        </select>
                    </td>
                </tr>
            </table>

            <hr width="70%" size="2" color="#0000CD">

            <!-- группированные элементы в рамке: fieldset + legend -->
            <fieldset style="width:460px; margin:0 auto">
                <legend><font face="Georgia" size="5" color="#CC00CC"><i>форма обучения</i></font></legend>
                <table width="100%">
                    <tr valign="top">
                        <td width="55%">
                            <!-- радио-кнопки: можно выбрать только одну -->
                            <input type="radio" name="forma" value="zaoch"> заочное<br>
                            <input type="radio" name="forma" value="dnev"> дневное<br>
                            <input type="radio" name="forma" value="uskor" checked> ускоренное
                        </td>
                        <td width="45%">
                            <!-- вложенная рамка с флажками: можно отметить несколько -->
                            <fieldset>
                                <input type="checkbox" name="oplata" value="grant" checked> грант<br>
                                <input type="checkbox" name="oplata" value="kredit"> кредит<br>
                                <input type="checkbox" name="oplata" value="dogovor"> договор
                            </fieldset>
                        </td>
                    </tr>
                </table>
            </fieldset>

        </td></tr>
        </table>

        <br>

        <!-- три вида кнопок -->
        <fieldset style="width:70%; margin:0 auto">
            <legend><font face="Georgia" size="5" color="#0000CD"><i>КНОПКИ:</i></font></legend>
            <table width="100%" align="center">
                <tr align="center" valign="middle">
                    <td width="33%">
                        <!-- обычная кнопка -->
                        <input type="button" value="элемент 'кнопка'">
                    </td>
                    <td width="33%">
                        <font color="#CC00CC" size="2">кнопка с изображением</font><br>
                        <!-- кнопка-изображение: картинка сама работает как кнопка -->
                        <input type="image" src="img/email.png" width="100" height="50" alt="E-mail">
                    </td>
                    <td width="33%">
                        <!-- кнопка с изображением внутри кнопки -->
                        <button type="submit" name="send">
                            Надпись <img src="img/email.png" width="100" height="50" alt="E-mail">
                        </button>
                    </td>
                </tr>
            </table>
        </fieldset>

    </form>

</body>
</html>
